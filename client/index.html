<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Brand logo: replace public/brand/logo.svg (and logo.png) to rebrand the whole app (favicon included). -->
    <link rel="icon" type="image/svg+xml" href="/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/brand/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>49Stores</title>
    <style>
      /* First-paint splash shown before the JS bundle loads; React replaces it on mount. */
      #boot-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f8fafc; }
      #boot-splash img { width: 72px; height: 72px; object-fit: contain; animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.88); opacity: 0.6; } }
      @media (prefers-reduced-motion: reduce) { #boot-splash img { animation: none; } }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"><div id="boot-splash"><img src="/brand/logo.svg" alt="" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
